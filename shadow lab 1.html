
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Position & Shadow</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      position: relative;
    }
  </style>
</head>
<body class="p-4">

  <h2>Bootstrap Position & Shadow Example</h2>

 
  <div class="position-absolute top-50 start-50 translate-middle p-4 bg-light shadow-lg rounded">
    <h5 class="mb-2">Centered Box</h5>
    <p>This box is centered using Bootstrap's position utilities and has a large shadow.</p>
  </div>

  
  <button class="btn btn-primary position-fixed bottom-0 end-0 m-3 shadow">
    Fixed Button
  </button>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
