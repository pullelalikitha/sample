
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Spacing Example</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="bg-light p-3 mb-3">
    <h4 class="mb-3">Margin Bottom (mb-3)</h4>
    <p class="m-0">This paragraph has no margin (m-0).</p>
  </div>

  <div class="bg-warning p-4 mt-4">
    <h4 class="mb-2">Padding All Sides (p-4)</h4>
    <p class="ps-5">Extra padding on the left (ps-5).</p>
  </div>

  <div class="bg-info text-white px-5 py-3 mt-5">
    <h4>Horizontal Padding (px-5) and Vertical Padding (py-3)</h4>
    <p class="mb-0">Spacing makes layout clean and readable.</p>
  </div>

</body>
</html>
